<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organigrama Multicloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F7F7FB; --ink:#17172A; --muted:#5D5D72;
  --line:#C5C6D6; --soft-line:#ECECF3; --accent:#4B3FC9; --accent-ink:#FFFFFF;
  --warn-bg:#FFF1E6; --warn:#8A3B12; --warn-strong:#E2620E; --warn-border:#F2B48A;
  --ok:#1E7A4C; --radius:16px;
  --co-home:#38A9E4; --co-home-bg:#EAF6FD; --co-ext:#2E9E5B; --co-ext-bg:#E8F6EE; --co-ext-ink:#1C6B3C;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:24px 32px 8px}
.eyebrow{font-size:13px;font-weight:700;color:var(--accent)}
h1{margin:2px 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:42px;padding:0 16px;border-radius:12px;border:1px solid #DCDCE8;background:var(--surface);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:#B9BACB}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2C2C45}
.btn.ghost{background:transparent}
.btn.danger{color:#B02525;border-color:#F0C4C4}
.btn.icon{width:42px;padding:0;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{flex:0 0 auto}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:10px;padding:12px 32px 4px}
.stat{display:flex;flex-direction:column;padding:10px 16px;background:var(--surface);border-radius:12px;min-width:118px}
.stat span:first-child{font-size:12px;color:var(--muted)}
.stat span:last-child{font-size:22px;font-weight:800}
.stat.warn{background:var(--warn-bg)}
.stat.warn span{color:var(--warn)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 32px}
.search{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid #DCDCE8;color:var(--muted)}
.search input{border:none;outline:none;background:transparent;width:220px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-left:auto;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* tree */
.board{display:flex;flex-direction:column;gap:16px;padding:0 32px 32px}
.tree-wrap{min-width:0;overflow:auto;padding:16px 0 32px;max-height:calc(100vh - 40px)}
.float-panel{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--radius);border:2px dashed #E3B341;background:#FFF8E5}
.float-panel h2{margin:0;font-size:15px;font-weight:800;color:#6B4E00}
.float-head{display:flex;align-items:center;gap:8px}
.float-head .count{font-weight:800;font-size:13px;padding:2px 9px;border-radius:999px;background:#FFFFFF;color:#6B4E00}
.float-panel .hint{margin:0;font-size:12px;color:#7A5D00;line-height:1.5}
.float-list{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.float-panel .team{width:320px;max-width:100%}
.float-panel .team.wide{width:600px}
.float-add{align-self:center}
.float-panel.empty{padding:12px 16px}
.float-panel.empty .hint{display:none}
.stack{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:22px}
.stack::before{content:'';position:absolute;left:0;top:0;bottom:30px;width:2px;background:var(--line)}
.stack-item{position:relative}
.stack-item::before{content:'';position:absolute;left:-22px;top:30px;width:22px;height:2px;background:var(--line)}
.stack .team{width:320px;max-width:none}
.stack .team.wide{width:600px}
.team.float{border-color:#E3B341;background:#FFFDF6}
.float-tag{margin:-4px 0 0;align-self:flex-start;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:#FCEBB6;color:#6B4E00}
@media (max-width:640px){.board{padding:0 16px 24px}.tree-wrap{max-height:none}}
.tree{display:flex;flex-direction:column;align-items:center;width:max-content;min-width:100%;transform-origin:top left}
.zoom{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid #DCDCE8}
.zoom button{min-width:36px;height:34px;border:none;border-radius:9px;background:transparent;font-weight:800}
.zoom button:hover{background:var(--bg)}
.zoom button[aria-pressed=true]{background:var(--ink);color:#fff}
.zoom output{min-width:48px;text-align:center;font-weight:700;font-size:13px}
.root{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--ink);color:#fff;border-radius:var(--radius);border:none;text-align:left}
.root .av{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800}
.root small{display:block;font-size:12px;color:#B9B9CC}
.root b{font-size:15px}
.vline{width:2px;height:26px;background:var(--line)}
.row{display:flex;width:100%;align-items:flex-start}
.col{flex:1 1 0;min-width:250px;display:flex;flex-direction:column;align-items:center;transition:flex-grow .2s}
.hline{align-self:stretch;height:2px;background:var(--line)}
.team{width:320px;max-width:calc(100% - 16px);background:var(--surface);border-radius:var(--radius);border:2px solid #8E90A6;padding:16px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s, box-shadow .15s}
.team.wide{width:600px}
.move-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--soft-line);padding-top:10px}
.move-row .mini:disabled{opacity:.3;cursor:default}
.team.collapsed{gap:10px;padding:12px 16px}
.team.collapsed .reports{margin-top:0}
.team .reports{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:6px 10px;margin-top:-4px}
.team.over{border-color:var(--warn-border)}
.team.drop, .pool.drop{border-color:var(--accent);border-style:dashed;box-shadow:0 0 0 4px #4B3FC91F}
.team-head{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:56px;height:56px;flex:0 0 56px}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.team h2{margin:0;font-size:15px;font-weight:800;overflow-wrap:normal;hyphens:manual}
.team-tools{gap:2px}
.team-tools .mini{width:30px;height:30px}
.team-head > div:nth-child(2){flex:1 1 auto}
.team .sub{font-size:12px;color:var(--muted)}
.team-tools{margin-left:auto;display:flex;gap:4px;align-self:flex-start}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--soft-line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.mini:hover{color:var(--ink);border-color:#C9CAD8}
.faces{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px}
.face{width:34px;height:34px;border-radius:50%;border:3px solid var(--co-home);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0;margin-left:-8px;cursor:grab}
.face:first-child{margin-left:0}
.face.more{background:var(--ink);color:#fff;cursor:pointer;border-color:var(--surface)}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
.warns{display:flex;flex-wrap:wrap;gap:6px}
.warn-pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.roles{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--soft-line);padding-top:12px}
.role-line{display:flex;align-items:center;gap:8px;font-size:13px}
.role-line i{width:10px;height:10px;border-radius:3px}
.role-line span{flex:1 1 auto}
.role-line b{font-weight:800}
.rep{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.rep select{flex:1 1 auto;min-width:0;min-height:36px;padding:0 8px;border-radius:9px;border:1px solid #DCDCE8;background:var(--surface);font-weight:600;color:var(--ink);font-size:13px}
.toggle{min-height:40px;border-radius:10px;border:1px solid #DCDCE8;background:var(--surface-2);font-weight:700}
.toggle:hover{border-color:#B9BACB}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;border-top:1px solid var(--soft-line);padding-top:12px}
.group{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.group-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}
.tag{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
.chip{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 10px 4px 4px;border-radius:10px;border:2px solid var(--co-home);background:var(--surface);text-align:left;font-weight:600;cursor:grab}
.chip:hover{filter:brightness(.97)}
.chip.ext{border-color:var(--co-ext)}
.chip .dot{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{opacity:.25}
.hit{box-shadow:0 0 0 3px var(--accent)}
.add-team{margin-top:28px}

/* pools */
.pools{display:flex;flex-wrap:wrap;gap:16px;margin:0 32px 40px}
.pool{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:12px;padding:16px 20px;border-radius:var(--radius);border:2px dashed var(--line);background:var(--surface)}
.pool{border-color:var(--co-home);background:var(--co-home-bg)}
.pool.ext{border-color:var(--co-ext);background:var(--co-ext-bg)}
.pool-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pool h2{margin:0;font-size:15px;font-weight:800}
.pool .count{font-weight:800;font-size:13px;padding:2px 9px;border-radius:999px;background:var(--bg)}
.pool .count{background:#FFFFFF}
.pool.ext .count{color:var(--co-ext-ink)}
.pool .hint{font-size:13px;color:var(--muted)}
.pool .pool-add{margin-left:auto;min-height:36px}
.pool-list{display:flex;flex-wrap:wrap;gap:8px}
.pool .chip{border-radius:999px}
.spec-tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#EEF0F5;color:#3F4152;margin-left:auto}
.chip .spec-tag + .co-tag{margin-left:2px}
.spec-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.spec-line .spec-tag{margin-left:0}
.co-tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--co-ext-bg);color:var(--co-ext-ink);margin-left:2px}
.face.ext{border-color:var(--co-ext)}
.co-legend{display:inline-flex;align-items:center;gap:6px}
.co-legend i{width:12px!important;height:12px!important;border-radius:50%!important;background:#fff!important;border:3px solid}
.team .sub.ext{color:var(--co-ext-ink);font-weight:700}
@media (max-width:640px){.pools{margin:0 16px 32px}}

/* dialog */
dialog{border:none;border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 24px 64px rgba(23,23,42,.28);color:var(--ink)}
dialog::backdrop{background:rgba(23,23,42,.4)}
.dlg{display:flex;flex-direction:column}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--soft-line)}
.dlg-head h3{margin:0;font-size:17px;font-weight:800}
.dlg-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:calc(100vh - 200px)}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--soft-line)}
.dlg-foot .left{margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid #D3D3E0;background:#fff;font-weight:500;color:var(--ink)}
.field textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role-edit{display:grid;grid-template-columns:minmax(0,1.6fr) 80px 48px auto auto;gap:8px;align-items:center}
.role-edit input[type=text]{min-height:38px;padding:0 10px;border-radius:9px;border:1px solid #D3D3E0;width:100%}
.role-edit input[type=color]{width:48px;height:38px;border:1px solid #D3D3E0;border-radius:9px;padding:2px;background:#fff}
.role-edit label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.sync{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.sync[data-kind=ok]{color:#1C6B3C;background:#E8F6EE}
.sync[data-kind=busy]{color:#5D5D72}
.sync[data-kind=error]{color:#8B1E1E;background:#FCE0E0}
.banner{margin:8px 32px 0;padding:12px 16px;border-radius:12px;background:var(--surface);font-weight:600}
.banner.error{background:#FCE0E0;color:#8B1E1E}
[hidden]{display:none!important}
body.locked .stats,body.locked .toolbar,body.locked .board,body.locked .pools,body.locked .actions .btn{display:none!important}
.who{font-size:12px;color:var(--muted);font-weight:600}
.login{display:flex;justify-content:center;padding:40px 16px}
.login-card{width:min(420px,100%);background:var(--surface);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(23,23,42,.08)}
.login-card h2{margin:0;font-size:22px;font-weight:800}
.login-msg{margin:0;font-size:13px;line-height:1.5}
.login-msg[data-kind=ok]{color:#1C6B3C}
.login-msg[data-kind=error]{color:#8B1E1E}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:640px){
  .top,.stats,.toolbar{padding-left:16px;padding-right:16px}
  .pool{margin:0 16px 32px}
  .search input{width:140px}
  h1{font-size:24px}
}
@media print{
  .actions,.toolbar,.team-tools,.toggle,.add-team{display:none!important}
  body{background:#fff}
}
</style>
</head>
<body>


<header class="top">
  <div>
    <div class="eyebrow">Organigrama</div>
    <h1 id="tribeName"></h1>
  </div>
  <div class="actions">
    <span id="syncStatus" class="sync" role="status" data-kind="busy">Conectando…</span>
    <span id="who" class="who" hidden></span>
    <button class="btn" id="passBtn" hidden>Contraseña</button>
    <button class="btn" id="logoutBtn" hidden>Salir</button>
    <button class="btn icon" data-act="undo" id="undoBtn" aria-label="Deshacer" title="Deshacer (Ctrl+Z)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 4L2.5 7.5 6 11"/><path d="M3 7.5h8a4.5 4.5 0 010 9H8"/></svg>
    </button>
    <button class="btn" data-act="import-menu">Importar</button>
    <button class="btn" data-act="export">Exportar JSON</button>
    <button class="btn" data-act="settings">Configuración</button>
    <button class="btn primary" data-act="add-person">+ Persona</button>
  </div>
</header>

<div class="banner" id="loading">Cargando el organigrama compartido…</div>
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="eyebrow">Organigrama · acceso</div>
    <h2>Ingresar</h2>
    <p class="note">Solo pueden acceder las personas habilitadas. Si no tenés usuario, pedíselo al administrador.</p>
    <label class="field">Mail<input id="loginEmail" type="email" required autocomplete="username" placeholder="nombre@empresa.com"></label>
    <label class="field">Contraseña<input id="loginPass" type="password" required autocomplete="current-password" minlength="6"></label>
    <button class="btn primary" id="loginBtn">Ingresar</button>
    <p class="login-msg" id="loginMsg" role="status"></p>
  </form>
</div>
<div class="banner error" id="offline" hidden>No se pudo conectar con los datos compartidos. Abrí esta página desde Claude con tu cuenta y recargala.</div>
<section class="stats" id="stats" aria-label="Resumen"></section>

<div class="toolbar">
  <label class="search">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5L13 13"/></svg>
    <span class="sr">Buscar</span>
    <input id="search" type="search" placeholder="Buscar persona o rol">
  </label>
  <button class="btn ghost" data-act="expand-all">Ampliar todos</button>
  <button class="btn ghost" data-act="collapse-all">Achicar todos</button>
  <button class="btn ghost" data-act="fold-all">Colapsar todos</button>
  <button class="btn ghost" data-act="unfold-all">Desplegar todos</button>
  <div class="zoom" role="group" aria-label="Zoom">
    <button type="button" data-act="zoom-out" aria-label="Alejar">−</button>
    <output id="zoomVal">100%</output>
    <button type="button" data-act="zoom-in" aria-label="Acercar">+</button>
    <button type="button" data-act="zoom-fit" style="padding:0 10px">Ajustar</button>
  </div>
  <div class="legend" id="legend"></div>
</div>

<div class="board">
  <div class="tree-wrap" id="treeWrap">
    <div class="tree" id="tree"></div>
  </div>
  <aside class="float-panel" id="floatPanel" aria-label="Equipos sin ubicar"></aside>
</div>

<div class="pools">
  <section class="pool" id="poolHome" data-drop="u" data-co="Personal" aria-label="Sin asignar de Personal"></section>
  <section class="pool ext" id="poolExt" data-drop="u" data-co="TMA" aria-label="Sin asignar de TMA"></section>
</div>

<dialog id="dlg"></dialog>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const KEY = 'organigrama-equipos-v1';
const UN = 'u';
const HOME = 'Personal', EXT = 'TMA';
const COMPANIES = [HOME, EXT];
const FLOAT = '~';

/* ---------- data ---------- */
function uid(p){ return p + Math.random().toString(36).slice(2, 9); }

function defaultRoles(){
  return [
    {id:'TL',  label:'Tech Lead',     short:'TL',  color:'#4B3FC9', lead:true},
    {id:'DEV', label:'Developer',     short:'DEV', color:'#1E7A4C'},
    {id:'SRE', label:'SRE',           short:'SRE', color:'#B4520E'},
    {id:'OPS', label:'DevOps',        short:'OPS', color:'#7B3BB8'},
    {id:'QA',  label:'QA',            short:'QA',  color:'#7A5D00'},
    {id:'PO',  label:'Product Owner', short:'PO',  color:'#0E6B78'},
    {id:'SM',  label:'Scrum Master',  short:'SM',  color:'#A3285A'},
    {id:'ARQ', label:'Arquitecto',    short:'ARQ', color:'#4A4C5C'},
    {id:'SEC', label:'Seguridad',     short:'SEC', color:'#B02525'}
  ];
}

function sample(){
  const teams = [
    {id:'t1', name:'Plataforma Cloud'}, {id:'t2', name:'Observabilidad'}, {id:'t3', name:'Ciberseguridad'},
    {id:'t4', name:'Virtualización'}, {id:'t5', name:'Resiliencia'}
  ];
  const raw = {
    t1:['A1:TL','A2:DEV','A3:DEV','A8:DEV','A4:OPS','A5:OPS','A6:SRE','A7:QA','A9:ARQ','A10:PO'],
    t2:['B1:TL','B2:SRE','B3:SRE','B4:DEV','B5:PO'],
    t3:['C1:SEC','C2:SEC','C3:SEC','C4:ARQ'],
    t4:['D1:TL','D2:OPS','D3:OPS','D9:OPS','D4:SRE','D5:DEV','D8:DEV','D6:QA','D7:SM'],
    t5:['E1:TL','E2:SRE','E3:SRE','E4:DEV','E5:QA','E6:SM'],

  const b = base({teams:d.teams, people:d.people, tribe:d.tribe || {name:'Mi tribu', lead:''}});

  b.expanded = d.expanded || {};

  b.teams.forEach(t => { if(t.parent === FLOAT) return; if(!t.parent || !teamIds.has(t.parent) || t.parent === t.id) t.parent = null; });
  // corta ciclos si el archivo viene roto
  b.teams.forEach(t => { const seen = new Set([t.id]); let p = t.parent;
    while(p){ if(seen.has(p)){ t.parent = null; break; } seen.add(p); p = (b.teams.find(x => x.id === p) || {}).parent; } });
  return b;
}

let DB = null;
const queue = []; let running = 0;
function setStatus(txt, kind){ const el = document.getElementById('syncStatus'); if(el){ el.textContent = txt; el.dataset.kind = kind || ''; } }
function enqueue(job){ queue.push(job); pump(); }
function pump(){
  setStatus('Guardando…', 'busy');
  while(running < 4 && queue.length){
    const job = queue.shift(); running++;
    job().catch(err => {
      const code = err && err.code;
      if(code === 'unavailable' || code === 'resource_exhausted'){ return new Promise(r => setTimeout(r, 600 + Math.random() * 800)).then(job); }
      throw err;
    }).catch(err => {
      setStatus('No se pudo guardar', 'error');
      toast(err && err.code === 'quota_exceeded' ? 'Se llenó el espacio de datos: borrá personas o equipos que no uses.' : 'No se pudo guardar un cambio. Revisá tu conexión y volvé a intentar.');
    }).finally(() => { running--; if(queue.length) pump(); else if(!running && document.getElementById('syncStatus').dataset.kind !== 'error') setStatus('Guardado · compartido', 'ok'); });
  }
}
function cfgOf(x){ return {tribe:x.tribe, settings:x.settings, roles:x.roles}; }
function teamDoc(t, i){ return {name:t.name, parent:t.parent == null ? null : t.parent, order:i}; }
function personDoc(p){ const o = Object.assign({}, p); delete o.id; return o; }
function sync(prev, next){
  if(JSON.stringify(cfgOf(prev)) !== JSON.stringify(cfgOf(next))){ const c = cfgOf(next); enqueue(() => DB.doc('meta/config').set(JSON.parse(JSON.stringify(c)))); }
  const pt = new Map(prev.teams.map((t, i) => [t.id, JSON.stringify(teamDoc(t, i))]));
  next.teams.forEach((t, i) => { const d = teamDoc(t, i); if(pt.get(t.id) !== JSON.stringify(d)) enqueue(() => DB.doc('teams/' + t.id).set(d)); pt.delete(t.id); });
  pt.forEach((_, id) => enqueue(() => DB.doc('teams/' + id).delete()));
  const pp = new Map(prev.people.map(p => [p.id, JSON.stringify(personDoc(p))]));
  next.people.forEach(p => { const d = personDoc(p); if(pp.get(p.id) !== JSON.stringify(d)) enqueue(() => DB.doc('people/' + p.id).set(JSON.parse(JSON.stringify(d)))); pp.delete(p.id); });
  pp.forEach((_, id) => enqueue(() => DB.doc('people/' + id).delete()));
}

const SUPABASE_URL = 'PEGAR_AQUI_PROJECT_URL';
const SUPABASE_ANON_KEY = 'PEGAR_AQUI_ANON_KEY';
let sb = null, myEmail = '';
const TABLE = {meta:'config', teams:'teams', people:'people'};
const cache = {config:new Map(), teams:new Map(), people:new Map()};
const listeners = {config:[], teams:[], people:[]};
function sbErr(error){ const m = (error && error.message) || ''; return {code: /fetch|network|timeout|Failed/i.test(m) ? 'unavailable' : 'invalid_argument', message:m}; }
function emit(t){ listeners[t].forEach(f => f()); }
function snapOf(id, d){ return {id, exists:!!d, data:() => d}; }
async function loadTable(t){
  const all = new Map(); let from = 0;
  while(true){
    const {data, error} = await sb.from(t).select('id,data').range(from, from + 999);
    if(error) throw sbErr(error);
    data.forEach(r => all.set(r.id, r.data));
    if(data.length < 1000) break; from += 1000;
  }
  cache[t] = all; emit(t);
}
const SBDB = {
  doc(path){
    const [col, id] = path.split('/'); const t = TABLE[col];
    return {
      set: async d => { const {error} = await sb.from(t).upsert({id, data:d}); if(error) throw sbErr(error); },
      delete: async () => { const {error} = await sb.from(t).delete().eq('id', id); if(error) throw sbErr(error); },
      onSnapshot(next, fail){ listeners[t].push(() => next(snapOf(id, cache[t].get(id)))); loadTable(t).catch(fail); return () => {}; }
    };
  },
  collection(col){
    const t = TABLE[col];
    const q = { limit(){ return q; }, onSnapshot(next, fail){
      listeners[t].push(() => { const docs = [...cache[t]].map(([id, d]) => snapOf(id, d)); next({docs, size:docs.length, empty:!docs.length}); });
      loadTable(t).catch(fail); return () => {}; } };
    return q;
  }
};
function listenRealtime(){
  const ch = sb.channel('organigrama');
  ['config','teams','people'].forEach(t => ch.on('postgres_changes', {event:'*', schema:'public', table:t}, p => {
    if(p.eventType === 'DELETE') cache[t].delete(p.old.id); else cache[t].set(p.new.id, p.new.data);
    emit(t);
  }));
  ch.subscribe(st => { if(st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setStatus('Tiempo real cortado · recargá la página', 'error'); });
  // al volver a la pestaña, traer lo último por si se perdió algún aviso
  document.addEventListener('visibilitychange', () => { if(!document.hidden && DB) ['config','teams','people'].forEach(t => loadTable(t).catch(() => {})); });
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function role(id){ return S.roles.find(r => r.id === id) || {id, label:id || 'Sin rol', short:(id||'?').slice(0,3), color:'#5D5D72'}; }
function soft(c){ return 'color-mix(in srgb, ' + c + ' 15%, white)'; }
function initials(name){
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  const last = parts[parts.length - 1] || '';
  if(/\d/.test(last) && last.length <= 4) return last.toUpperCase();
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + last[0]).toUpperCase();
}
function membersOf(teamId){ return S.people.filter(p => p.team === teamId); }
function setParent(t, parent){
  if(parent === FLOAT) S.teams.forEach(x => { if(x.parent === t.id) x.parent = (t.parent === FLOAT ? null : t.parent) || null; });
  t.parent = parent;
}
function childrenOf(id){ return S.teams.filter(t => (t.parent || null) === id); }
function descendants(id){ const out = []; childrenOf(id).forEach(c => { out.push(c.id); out.push(...descendants(c.id)); }); return out; }
function isStack(id){ return false; } // sub-equipos siempre uno al lado del otro
function leaves(id){ const ch = childrenOf(id); return (!ch.length || isStack(id) || (S.collapsed || {})[id]) ? 1 : ch.reduce((a, c) => a + leaves(c.id), 0); }
function depthOf(t){ let d = 0, p = t.parent; while(p){ d++; p = (S.teams.find(x => x.id === p) || {}).parent; } return d; }
function matches(p){
  if(!query) return true;
  const q = query.toLowerCase(), r = role(p.role);
  return p.name.toLowerCase().includes(q) || (p.title || '').toLowerCase().includes(q) || (p.manager || '').toLowerCase().includes(q) || (p.spec || '').toLowerCase() === q || r.label.toLowerCase().includes(q) || r.short.toLowerCase() === q || (p.company || '').toLowerCase() === q;
}

function toast(msg){

  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function analyze(teamId){
  const m = membersOf(teamId);
  const counts = {};
  m.forEach(p => counts[p.role] = (counts[p.role] || 0) + 1);
  const present = S.roles.filter(r => counts[r.id]).map(r => r.id)
    .concat(Object.keys(counts).filter(k => !S.roles.some(r => r.id === k)));
  const {maxSize, minSize, maxRoles} = S.settings;
  const n = m.length;
  const warns = [];
  if(n > maxSize) warns.push('+' + (n - maxSize) + ' sobre el máximo');
  if(n > 0 && n < minSize) warns.push('Equipo chico (' + n + ')');
  const leadRoles = S.roles.filter(r => r.lead).map(r => r.id);
  if(n > 0 && leadRoles.length && !m.some(p => leadRoles.includes(p.role))) warns.push('Sin ' + leadRoles.map(id => role(id).label).join(' / '));
  if(present.length > maxRoles) warns.push(present.length + ' roles distintos (máx. ' + maxRoles + ')');
  const specs = {}; m.forEach(p => { if(p.spec) specs[p.spec] = (specs[p.spec] || 0) + 1; });
  return {m, n, counts, present, warns, specs, over: n > maxSize, ext: m.filter(p => p.company === EXT).length};
}

function siblingsOf(t){ const p = t.parent || null; return S.teams.filter(x => (x.parent || null) === p); }
function moveRow(t){
  const sib = siblingsOf(t), i = sib.indexOf(t);
  if(sib.length < 2) return '';
  return '<div class="move-row">' +
    '<button class="mini" data-act="move-left" data-tid="' + t.id + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Mover ' + esc(t.name) + ' a la izquierda" title="Mover a la izquierda"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>' +
    '<span>Mover</span>' +
    '<button class="mini" data-act="move-right" data-tid="' + t.id + '"' + (i === sib.length - 1 ? ' disabled' : '') + ' aria-label="Mover ' + esc(t.name) + ' a la derecha" title="Mover a la derecha"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>' +
    '</div>';
}
function moveTeam(tid, dir){
  const t = S.teams.find(x => x.id === tid); if(!t) return;
  const sib = siblingsOf(t), i = sib.indexOf(t), o = sib[i + dir]; if(!o) return;
  commit(() => { const a = S.teams.indexOf(t), b = S.teams.indexOf(o); S.teams[a] = o; S.teams[b] = t; });
}
function borderFor(n){ return n <= 2 ? 1 : n <= 5 ? 2 : n <= 8 ? 3 : n <= 12 ? 5 : n <= 18 ? 7 : 9; }
function teamCard(t){
  const a = analyze(t.id);
  const exp = !!S.expanded[t.id];
  const max = S.settings.maxSize;
  const kids = childrenOf(t.id);
  const floating = t.parent === FLOAT;
  const col = !!(S.collapsed || {})[t.id];
  const subTotal = kids.length ? descendants(t.id).reduce((s, id) => s + membersOf(id).length, a.n) : 0;
  let h = '' +
        '<article class="team' + (a.over ? ' over' : '') + (exp && !col ? ' wide' : '') + (floating ? ' float' : '') + (col ? ' collapsed' : '') + '" style="border-width:' + borderFor(a.n) + 'px" data-drop="' + t.id + '" aria-label="Equipo ' + esc(t.name) + '">' +
          (floating ? '<div class="float-tag">Sin ubicar · elegí de quién depende</div>' : '') + '<div class="team-head">' + ringSvg(a.n, max, a.over) +
            '<div style="min-width:0"><h2>' + esc(t.name) + '</h2><div class="sub">' + a.n + ' de ' + max + ' · ' + a.present.length + (a.present.length === 1 ? ' rol' : ' roles') + '</div>' +
            (a.ext ? '<div class="sub ext">' + a.ext + ' de TMA</div>' : '') +
            '</div>' +
            '<div class="team-tools">' +
              '<button class="mini" data-act="collapse" data-tid="' + t.id + '" aria-expanded="' + !col + '" aria-label="' + (col ? 'Desplegar' : 'Colapsar') + ' equipo ' + esc(t.name) + '" title="' + (col ? 'Desplegar' : 'Colapsar') + '">' + (col ? ICON_DOWN : ICON_UP) + '</button>' +
              '<button class="mini" data-act="edit-team" data-tid="' + t.id + '" aria-label="Editar equipo ' + esc(t.name) + '">' + ICON_EDIT + '</button>' +
              '<button class="mini" data-act="toggle" data-tid="' + t.id + '" aria-label="' + (exp ? 'Achicar' : 'Ampliar') + ' equipo">' + (exp ? ICON_SHRINK : ICON_EXPAND) + '</button>' +
            '</div></div>';
      if(kids.length) h += '<div class="reports">' + kids.length + (kids.length === 1 ? ' equipo' : ' equipos') + ' a cargo · <b>' + subTotal + '</b> personas en total' + (col ? ' · ocultos' : '') + '</div>';
      if(col){
        if(a.warns.length) h += '<div class="warns">' + a.warns.map(w => '<span class="warn-pill">' + esc(w) + '</span>').join('') + '</div>';
        return h + moveRow(t) + '</article>';
      }
      if(!exp){
        if(a.n){
          const show = a.m.slice(0, 7);
          h += '<div class="faces">' + show.map(face).join('') +
            (a.n > 7 ? '<button class="face more" data-act="toggle" data-tid="' + t.id + '" aria-label="Ver ' + (a.n - 7) + ' más">+' + (a.n - 7) + '</button>' : '') + '</div>';
        } else {
          h += '<div class="empty">Arrastrá personas acá</div>';
        }
      }
      const sp = Object.keys(a.specs).sort();
      if(sp.length) h += '<div class="spec-line">Especialidad:' + sp.map(k => '<span class="spec-tag">' + esc(k) + ' · ' + a.specs[k] + '</span>').join('') + '</div>';
      if(a.warns.length) h += '<div class="warns">' + a.warns.map(w => '<span class="warn-pill">' + esc(w) + '</span>').join('') + '</div>';
      if(exp){
        h += '<div class="groups">' + (a.present.length ? a.present.map(rid => {
          const r = role(rid);
          return '<div class="group"><div class="group-head"><span class="tag" style="background:' + soft(r.color) + ';color:' + esc(r.color) + '">' + esc(r.label) + '</span><span>' + a.counts[rid] + '</span></div>' +
            a.m.filter(p => p.role === rid).map(p => chip(p, false)).join('') + '</div>';
        }).join('') : '<div class="empty">Arrastrá personas acá</div>') + '</div>';
      } else if(a.present.length){
        h += '<div class="roles">' + a.present.map(rid => {
          const r = role(rid);
          return '<div class="role-line"><i style="background:' + esc(r.color) + '"></i><span>' + esc(r.label) + '</span><b>' + a.counts[rid] + '</b></div>';
        }).join('') + '</div>';
      }
      const blocked = [t.id].concat(descendants(t.id));
      h += '<label class="rep">Reporta a<select data-rep="' + t.id + '">' +
        '<option value="' + FLOAT + '"' + (floating ? ' selected' : '') + '>— Sin ubicar —</option>' +
        '<option value=""' + (t.parent == null ? ' selected' : '') + '>' + esc(S.tribe.lead || 'Líder de tribu') + '</option>' +
        S.teams.filter(x => !blocked.includes(x.id) && x.parent !== FLOAT).map(x => '<option value="' + x.id + '"' + (x.id === t.parent ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') +
        '</select></label>';
      h += '<button class="toggle" data-act="toggle" data-tid="' + t.id + '">' + (exp ? 'Achicar' : 'Ver integrantes') + '</button>' +
        moveRow(t) + '</article>';
  return h;
}

function renderLevel(list, minW){
  const n = list.length;
  let h = '<div class="row"' + (minW ? ' style="min-width:' + minW + 'px"' : '') + '>';
  list.forEach((t, i) => {
      const a = analyze(t.id);
      const exp = !!S.expanded[t.id];
      const max = S.settings.maxSize;
      const kids = childrenOf(t.id);
      const lv = leaves(t.id);
      const subTotal = kids.length ? descendants(t.id).reduce((s, id) => s + membersOf(id).length, a.n) : 0;
      const stack = isStack(t.id);
      const wideKid = stack && kids.some(k => S.expanded[k.id]);
      const colW = Math.max(lv * 340, (exp || wideKid) ? 660 : 360);
      h += '<div class="col" style="flex-grow:' + ((exp || wideKid) ? Math.max(lv, 2.2) : lv) + ';min-width:' + colW + 'px">' +
        '<div class="hline" style="margin-left:' + (i === 0 ? '50%' : '0') + ';margin-right:' + (i === n - 1 ? '50%' : '0') + ';' + (n === 1 ? 'visibility:hidden' : '') + '"></div>' +
        '<div class="vline" style="height:22px"></div>' +
        teamCard(t) +
        (kids.length && !(S.collapsed || {})[t.id] ? '<div class="vline"></div>' + (stack
          ? '<div class="stack">' + kids.map(k => '<div class="stack-item">' + teamCard(k) + '</div>').join('') + '</div>'
          : renderLevel(kids, 0)) : '') +
        '</div>';
  });
  return h + '</div>';
}

function importDialog(){
  openDialog('Importar',
    '<p class="note">Pegá una lista con una persona por línea: <b>Nombre; Rol; Equipo; Compañía; Especialidad</b> (también acepta comas o tabulaciones, por ejemplo copiado de Excel). El rol puede ser la sigla o el nombre; los roles y equipos que no existan se crean solos. Si falta el equipo, la persona queda en "Sin asignar". La compañía es opcional: poné TMA para quienes vienen de TMA (si no, se toma Personal).</p>' +
    '<label class="field">Lista<textarea name="csv" placeholder="Ana Pérez; TL; Plataforma Cloud&#10;Juan Gómez; SRE; Observabilidad&#10;Laura Díaz; DevOps; ; TMA"></textarea></label>' +
    '<label class="field" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="replace" style="min-height:auto"> Reemplazar a todas las personas actuales</label>' +
    '<p class="note">¿Tenés un archivo exportado antes? <button type="button" class="btn" id="pickJson" style="min-height:34px;margin-left:6px">Abrir JSON…</button></p>',
    '<button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok">Importar lista</button>',
    f => {
      const lines = f.elements.csv.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if(!lines.length) return false;
      let added = 0;
      commit(() => {
        if(f.elements.replace.checked) S.people = [];
        lines.forEach(line => {
          const parts = line.split(/\t|;|,/).map(x => x.trim());
          const name = parts[0]; if(!name || /^nombre$/i.test(name)) return;
          const rRaw = parts[1] || '', tRaw = parts[2] || '', company = /^tma$/i.test(parts[3] || '') ? EXT : HOME, spec = parts[4] || '';
          let r = S.roles.find(x => x.short.toLowerCase() === rRaw.toLowerCase() || x.label.toLowerCase() === rRaw.toLowerCase());
          if(!r && rRaw){ r = {id:uid('r'), label:rRaw, short:rRaw.slice(0,3).toUpperCase(), color:'#5D5D72'}; S.roles.push(r); }
          let team = UN;
          if(tRaw && !/^sin asignar$/i.test(tRaw)){
            let t = S.teams.find(x => x.name.toLowerCase() === tRaw.toLowerCase());
            if(!t){ t = {id:uid('t'), name:tRaw}; S.teams.push(t); }
            team = t.id;
          }
          S.people.push({id:uid('p'), name, role: r ? r.id : (S.roles[0] || {}).id, team, company, spec});
          added++;
        });
      });
      toast(added + ' personas importadas');
    },
    f => f.querySelector('#pickJson').addEventListener('click', () => { dlg.close(); $('#fileIn').click(); }));
}

/* ---------- export / import file ---------- */
function exportJson(){
  const data = JSON.stringify({version:1, tribe:S.tribe, settings:S.settings, roles:S.roles, teams:S.teams, people:S.people}, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = 'organigrama-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Archivo descargado');
}
$('#fileIn').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const d = normalize(JSON.parse(rd.result)); d.expanded = S.expanded; d.collapsed = S.collapsed; commit(() => { S = d; }); toast('Organigrama cargado para todos'); }
    catch(err){ toast('No pude leer ese archivo'); }
  };
  rd.readAsText(file);
  e.target.value = '';
});

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || dlg.contains(el)) return;
  const act = el.dataset.act, tid = el.dataset.tid;
  if(act === 'toggle'){ S.expanded[tid] = !S.expanded[tid]; save(); render(); }
  else if(act === 'expand-all'){ S.teams.forEach(t => S.expanded[t.id] = true); save(); render(); }
  else if(act === 'collapse-all'){ S.expanded = {}; save(); render(); }
  else if(act === 'collapse'){ S.collapsed = S.collapsed || {}; if(S.collapsed[tid]) delete S.collapsed[tid]; else S.collapsed[tid] = true; save(); render(); }
  else if(act === 'fold-all'){ S.collapsed = {}; S.teams.forEach(t => S.collapsed[t.id] = true); save(); render(); }
  else if(act === 'unfold-all'){ S.collapsed = {}; save(); render(); }
  else if(act === 'edit-person'){ const p = S.people.find(x => x.id === el.dataset.pid); if(p) personDialog(p); }
  else if(act === 'add-person') personDialog(null, el.dataset.co);
  else if(act === 'edit-team') teamDialog(S.teams.find(x => x.id === tid));
  else if(act === 'add-team') teamDialog(null);
  else if(act === 'settings') settingsDialog();
  else if(act === 'export') exportJson();
  else if(act === 'import-menu') importDialog();
  else if(act === 'undo') undo();
  else if(act === 'move-left') moveTeam(tid, -1);
  else if(act === 'move-right') moveTeam(tid, 1);
  else if(act === 'zoom-in') setZoom(zoom + 0.1);
  else if(act === 'zoom-out') setZoom(zoom - 0.1);
  else if(act === 'zoom-fit') fitZoom();
});

document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-pid]'); if(!el) return;
  dragId = el.dataset.pid;
  try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('dragover', e => {
  const zone = e.target.closest && e.target.closest('[data-drop]'); if(!zone || !dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.drop').forEach(x => { if(x !== zone) x.classList.remove('drop'); });
  zone.classList.add('drop');
});
document.addEventListener('dragleave', e => {
  const zone = e.target.closest && e.target.closest('[data-drop]');
  if(zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drop');
});
document.addEventListener('drop', e => {
  const zone = e.target.closest && e.target.closest('[data-drop]'); if(!zone) return;
  e.preventDefault();
  const id = dragId || e.dataTransfer.getData('text/plain');
  const team = zone.dataset.drop;
  const p = S.people.find(x => x.id === id);
  dragId = null;
  zone.classList.remove('drop');
  const co = zone.dataset.co;
  if(!p || (p.team === team && (!co || p.company === co))) return;
  const dest = team === UN ? 'Sin asignar · ' + co : (S.teams.find(t => t.id === team) || {}).name;
  commit(() => { p.team = team; if(co) p.company = co; });
  toast(p.name + ' → ' + dest);
});

document.addEventListener('change', e => {
  const sel = e.target.closest && e.target.closest('[data-rep]'); if(!sel) return;
  const t = S.teams.find(x => x.id === sel.dataset.rep); if(!t) return;
  const parent = sel.value || null;
  commit(() => { setParent(t, parent); });
  toast(t.name + (parent === FLOAT ? ' → sin ubicar' : ' → reporta a ' + (parent ? S.teams.find(x => x.id === parent).name : (S.tribe.lead || 'Líder de tribu'))));
});
$('#search').addEventListener('input', e => { query = e.target.value.trim(); renderTree(); renderPool(); });
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !dlg.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); }
});

let zoom = 1, autoFit = true;
try { const z = localStorage.getItem(KEY + '-zoom'); if(z && z !== 'auto'){ zoom = parseFloat(z) || 1; autoFit = false; } } catch(e){}
function applyZoom(){
  const t = $('#tree');
  t.style.zoom = zoom;
  $('#zoomVal').textContent = Math.round(zoom * 100) + '%';
  const fb = document.querySelector('[data-act=zoom-fit]'); if(fb) fb.setAttribute('aria-pressed', autoFit ? 'true' : 'false');
}
function setZoom(z, keepAuto){
  zoom = Math.min(2, Math.max(0.25, Math.round(z * 100) / 100));
  if(!keepAuto) autoFit = false;
  try { localStorage.setItem(KEY + '-zoom', autoFit ? 'auto' : zoom); } catch(e){}
  applyZoom();
}
function fitZoom(){
  const t = $('#tree'), w = $('#treeWrap');
  t.style.zoom = 1;
  const avail = w.clientWidth - 40;
  autoFit = true;
  setZoom(Math.max(0.4, Math.min(1, avail / t.scrollWidth)), true);
  w.scrollLeft = 0;
}
// Shift + rueda = scroll horizontal; Ctrl/⌘ + rueda = zoom
$('#treeWrap').addEventListener('wheel', e => {
  if(e.ctrlKey || e.metaKey){ e.preventDefault(); setZoom(zoom - Math.sign(e.deltaY) * 0.05); }
}, {passive:false});
// al arrastrar una persona cerca del borde, la vista se desplaza sola
let edgeTimer = null, edgeDx = 0;
document.addEventListener('dragover', e => {
  if(!dragId) return;
  const w = $('#treeWrap'), r = w.getBoundingClientRect(), m = 80;
  edgeDx = e.clientX < r.left + m ? -18 : (e.clientX > r.right - m ? 18 : 0);
  if(edgeDx && !edgeTimer) edgeTimer = setInterval(() => { if(!edgeDx || !dragId){ clearInterval(edgeTimer); edgeTimer = null; return; } w.scrollLeft += edgeDx; }, 16);
});
document.addEventListener('dragend', () => { edgeDx = 0; });

// pellizco con trackpad en Safari
let gBase = 1;
const tw = $('#treeWrap');
tw.addEventListener('gesturestart', e => { e.preventDefault(); gBase = zoom; });
tw.addEventListener('gesturechange', e => { e.preventDefault(); setZoom(gBase * e.scale); });
tw.addEventListener('gestureend', e => e.preventDefault());
let rzT;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if(autoFit) fitZoom(); }, 120); });

render();
if(autoFit) fitZoom(); else applyZoom();
})();
</script>

</body>
</html>
